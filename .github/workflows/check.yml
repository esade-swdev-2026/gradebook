# Runs on every push and every pull request. The four checks below are exactly the
# commands in the README's "Develop" section — CI is not a different standard, it is
# the same one, run on a machine none of us owns. From module 4, when you start
# merging through pull requests, a red check blocks the merge.
name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Pinned to floating major tags so security patches arrive without edits.
      # Both run on node24: node20 actions emit a deprecation warning, and this is
      # the first green check sixty-two students will ever see. Note that
      # astral-sh/setup-uv stopped publishing floating major tags after v7 — the
      # newest exact release is v10.x, so moving past v7 means pinning a full
      # version and bumping it by hand.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv (and Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest

      - name: Build the image
        run: docker build -t gradebook .

      - name: Run the image
        run: docker run --rm gradebook --help

  release:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE:$SHA" .

      - name: Push it, tagged with the commit
        run: docker push "$IMAGE:$SHA"

      - name: Push it, tagged with the version
        if: github.ref_type == 'tag'
        run: |
          docker tag "$IMAGE:$SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"

      - name: Pull it back and run it
        run: |
          docker image rm "$IMAGE:$SHA"
          published="$IMAGE:$SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker image rm "$IMAGE:$GITHUB_REF_NAME"
            published="$IMAGE:$GITHUB_REF_NAME"
          fi
          docker pull "$published"
          docker run --rm "$published" --help
